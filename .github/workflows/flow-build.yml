name: flow-build

# Builds the patched (v8::Locker) rusty_v8 static library for the targets the
# flow / edge-runtime ships — release, simdutf — and publishes each one (plus
# the matching src_binding.rs) as a GitHub Release asset.
#
#   * x86_64-unknown-linux-gnu   -> normal Linux (glibc)
#   * x86_64-pc-windows-msvc     -> Windows (MSVC, static CRT compatible)
#
# Feature set matches Deno v2.9.0's pin:
#   v8 = { version = "149.4.0", default-features = false, features = ["simdutf"] }
#
# The release MUST be tagged `v{crate-version}` (i.e. `v150.4.0`) so that the
# rusty_v8 build script can find the assets via RUSTY_V8_MIRROR. Consume from
# the embedder with a single env var (no local V8 source build, no manual
# src_binding handling — build.rs auto-downloads both from {mirror}/v150.4.0/):
#   RUSTY_V8_MIRROR=https://github.com/<owner>/rusty_v8/releases/download
# (build.rs fetches <lib>_simdutf_release_<target>.<ext>.gz and the matching
#  src_binding_simdutf_release_<target>.rs from that base + /v150.4.0/, where
#  <lib>.<ext> is librusty_v8.a everywhere except Windows, which uses
#  rusty_v8.lib.)

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to create/update (must be v<crate-version>, e.g. v150.4.0)"
        required: true
        default: "v150.4.0"
      target:
        description: "Which target to build ('all', or a single triple). Rebuilding a target REPLACES its published lib + src_binding pair, so pick one target when you only need to add a missing one."
        required: true
        default: "all"
        type: choice
        options:
          - all
          - x86_64-unknown-linux-gnu
          - x86_64-pc-windows-msvc
  push:
    tags:
      # `v150.4.0` (matches the crate version → RUSTY_V8_MIRROR path) and any
      # explicit flow-suffixed tag for one-off builds.
      - "v[0-9]+.[0-9]+.[0-9]+"
      - "*-flow*"

permissions:
  contents: write

jobs:
  # Selects which targets to build. A tag push always builds every target; a
  # manual dispatch can narrow to one, because republishing a target swaps both
  # its lib and its src_binding at the same URLs, and an embedder holding a
  # cached copy of only one of the pair gets an ABI mismatch (which segfaults at
  # runtime, not at link time). So when you only need to ADD a target, build
  # just that target. This has to be a separate job: a job-level `if:` cannot
  # reference `matrix`, so the filtering happens before the matrix exists.
  #
  # GN emits `obj/librusty_v8.a` on unix and `obj/rusty_v8.lib` on Windows;
  # build.rs's static_lib_name() expects the published asset to keep that
  # platform name, hence the per-target lib/ext. Windows uses V8's own bundled
  # clang and links the static CRT, which is what flow's `+crt-static` rustflag
  # needs.
  setup:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.pick.outputs.matrix }}
    steps:
      - name: Pick targets
        id: pick
        shell: bash
        env:
          TARGET_FILTER: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.target || 'all' }}
        run: |
          all='[
            {"target":"x86_64-unknown-linux-gnu","runner":"ubuntu-22.04","lib":"librusty_v8","ext":"a"},
            {"target":"x86_64-pc-windows-msvc","runner":"windows-2022","lib":"rusty_v8","ext":"lib"}
          ]'
          if [ "$TARGET_FILTER" = "all" ]; then
            matrix="$(echo "$all" | jq -c .)"
          else
            matrix="$(echo "$all" | jq -c --arg t "$TARGET_FILTER" '[.[] | select(.target == $t)]')"
          fi
          if [ "$(echo "$matrix" | jq 'length')" -eq 0 ]; then
            echo "no target matches '$TARGET_FILTER'" >&2
            exit 1
          fi
          echo "building: $(echo "$matrix" | jq -r 'map(.target) | join(", ")')"
          echo "matrix=$matrix" >> "$GITHUB_OUTPUT"

  build:
    name: release ${{ matrix.config.target }} simdutf
    needs: setup
    runs-on: ${{ matrix.config.runner }}
    timeout-minutes: 240
    strategy:
      # One target failing must not cancel the other: a published Linux asset
      # is still useful on its own.
      fail-fast: false
      matrix:
        config: ${{ fromJson(needs.setup.outputs.matrix) }}
    defaults:
      run:
        # git bash on the Windows runner, so one script works on both.
        shell: bash
    env:
      TARGET: ${{ matrix.config.target }}
      LIB_NAME: ${{ matrix.config.lib }}
      LIB_EXT: ${{ matrix.config.ext }}
      V8_FROM_SOURCE: true
      RUSTFLAGS: -D warnings
      # Resolve the release tag from either the pushed tag or the manual input.
      RELEASE_TAG: ${{ github.event_name == 'push' && github.ref_name || github.event.inputs.tag }}
    steps:
      - name: Free up disk space
        if: runner.os == 'Linux'
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
            /usr/local/share/boost "$AGENT_TOOLSDIRECTORY" || true
          df -h /

      - name: Report disk space
        # A from-source V8 build needs ~20GB of scratch. The Windows runner is
        # the tight one; if this build ever dies on ENOSPC, that is the first
        # thing to check.
        run: df -h

      - name: Configure git
        # Required on Windows: the V8 checkout contains symlinks.
        run: git config --global core.symlinks true

      - name: Clone repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 10
          submodules: recursive

      - name: Install rust
        uses: dsherret/rust-toolchain-file@v1

      - name: Add rust target
        run: rustup target add "$TARGET"

      - name: Install python
        uses: actions/setup-python@v5
        with:
          python-version: 3.11.x
          architecture: x64

      - name: Write git_submodule_status.txt
        run: git submodule status --recursive > git_submodule_status.txt

      - name: Cache
        uses: actions/cache@v4
        with:
          path: |-
            target/sccache
            target/*/.*
            target/*/build
            target/*/deps
          key: flow-${{ env.TARGET }}-release-simdutf-${{ hashFiles('Cargo.lock', 'build.rs', 'git_submodule_status.txt') }}
          restore-keys: flow-${{ env.TARGET }}-release-simdutf-

      - name: Install and start sccache
        # gn_out is deliberately not in the cache paths above (it is huge), so
        # sccache is what keeps a re-run from recompiling all of V8.
        env:
          SCCACHE_DIR: ${{ github.workspace }}/target/sccache
          SCCACHE_CACHE_SIZE: 1G
          SCCACHE_IDLE_TIMEOUT: 0
        run: |
          version="v0.8.2"
          case "$TARGET" in
            *windows*) platform="x86_64-pc-windows-msvc"; exe=".exe" ;;
            *)         platform="x86_64-unknown-linux-musl"; exe="" ;;
          esac
          basename="sccache-$version-$platform"
          curl -LO "https://github.com/mozilla/sccache/releases/download/$version/$basename.tar.gz"
          tar -xzf "$basename.tar.gz"
          "./$basename/sccache$exe" --start-server
          echo "$(pwd)/$basename" >> "$GITHUB_PATH"

      - name: Install Clang 19
        # Linux only: on Windows the GN build uses V8's own bundled clang from
        # third_party/llvm-build, and bindgen picks it up from there.
        if: runner.os == 'Linux'
        run: |
          echo "deb http://apt.llvm.org/jammy/ llvm-toolchain-jammy-19 main" | sudo dd of=/etc/apt/sources.list.d/llvm-toolchain-jammy-19.list
          curl https://apt.llvm.org/llvm-snapshot.gpg.key | gpg --dearmor | sudo dd of=/etc/apt/trusted.gpg.d/llvm-snapshot.gpg
          sudo apt-get update
          sudo apt-get -qq remove 'clang-*' || true
          sudo apt-get install lld-19 clang-19 clang-tools-19 libclang-19-dev -y
          echo "LIBCLANG_PATH=/usr/lib/llvm-19/lib" >> "$GITHUB_ENV"

      - name: Build (release, simdutf, from source)
        env:
          SCCACHE_IDLE_TIMEOUT: 0
        run: cargo build -vv --release --locked --target "$TARGET" --features simdutf

      - name: Package artifacts
        run: |
          OUT="target/$TARGET/release/gn_out"
          LIB="${LIB_NAME}_simdutf_release_${TARGET}.${LIB_EXT}.gz"
          BIND="src_binding_simdutf_release_${TARGET}.rs"
          gzip -9c "$OUT/obj/${LIB_NAME}.${LIB_EXT}" > "target/$LIB"
          cp "$OUT/src_binding.rs" "target/$BIND"
          ls -l "target/$LIB" "target/$BIND"
          echo "LIB=$LIB" >> "$GITHUB_ENV"
          echo "BIND=$BIND" >> "$GITHUB_ENV"

      - name: Publish to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          name: ${{ env.RELEASE_TAG }}
          fail_on_unmatched_files: true
          files: |
            target/${{ env.LIB }}
            target/${{ env.BIND }}
